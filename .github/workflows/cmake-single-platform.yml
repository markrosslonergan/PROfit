# This starter workflow is for a CMake project running on a single platform. There is a different starter workflow if you need cross-platform coverage.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-multi-platform.yml
name: CMake on a single platform

on:
  push:
    branches: [ "project-SBN-dev" ]
  pull_request:
    branches: [ "project-SBN-dev" ]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build:
    # The CMake configure and build commands are platform agnostic and should work equally well on Windows or Mac.
    # You can convert this to a matrix build if you need cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4
    - name: Install HDF5
      run: sudo apt-get update && sudo apt-get install -y libhdf5-dev
    - name: Install Boost 1.82.0
      uses: MarkusJx/install-boost@v2.4.5
      id: install-boost
      with:
        # A list of available versions can be found at: 
        # https://github.com/MarkusJx/prebuilt-boost/releases
        boost_version: 1.82.0
        # Optional: If you only need specific libraries (e.g., system, filesystem)
        # boost_install_dir: ${{ github.workspace }}/boost
    - name: Install ROOT
      run: wget https://root.cern/download/root_v6.28.12.Linux-ubuntu22-x86_64-gcc11.4.tar.gz && tar -xzvf root_v6.28.12.Linux-ubuntu22-x86_64-gcc11.4.tar.gz
    - name: Configure CMake
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: source root/bin/thisroot.sh && root --version && cd ${{github.workspace}}/build && cmake .. -DBOOST_ROOT=${{ steps.install-boost.outputs.BOOST_ROOT }} -DBoost_NO_SYSTEM_PATHS=ON
    - name: Build
      # Build your program with the given configuration
      run: cd ${{github.workspace}}/build && make -j10
    - name: plot
      # Build your program with the given configuration
      run: cd ${{github.workspace}}/ci && export PATH=$PATH:$PWD/../build/bin && PROfit -x ci_quick.xml -t quick_v0.1_FullSBN_nue_app plot 
    # - name: Test
    #   run: export PATH=${{github.workspace}}/build/bin && PROfit -x ${{github.workspace}}/xml/PROfit_Tutorial_Oct2025v1_SPINE_ICARUS_numu_dis.xml --log workflow.out -w 4 surface -g 40 --logx --logy --xlo 0.001
    # - name: Test
    #   working-directory: ${{github.workspace}}/build
    #   # Execute tests defined by the CMake configuration.
    #   # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
    #   run: ctest -C ${{env.BUILD_TYPE}}
